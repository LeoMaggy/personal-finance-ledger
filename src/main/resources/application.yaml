app:
  jwt:
    # Dev-only default after the colon; on AWS (Day 6) the real secret comes from the JWT_SECRET variable
    secret: ${JWT_SECRET:hSJBO50ZVgvvE4rZcXOddVW4R5pzNkVEnZHpfrpbrGE=}
    ttl: 1h                        # token lifetime; Spring converts "1h" into a Duration
    issuer: finance-ledger
  reminders:
    cron: "0 0 9 * * *"              # second minute hour day month weekday: 9:00 AM daily    //0 * * * * *   //0 0 9 * * *
    zone: Asia/Kolkata               # the users' time zone, not the server's
  mail:
    from: "Finance Ledger <no-reply@finance-ledger.local>"
spring:
  application:
    name: finance-ledger
  datasource:                      # used when you run without Docker Compose support
    url: jdbc:postgresql://localhost:5432/expenses
    username: expenses
    password: expenses
  jpa:
    open-in-view: false            # no lazy loading in controllers (explained below)
    hibernate:
      ddl-auto: validate           # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  threads:
    virtual:
      enabled: true                # Java 21 virtual threads for requests

  mail:
    host: localhost
    port: 1025                       # Mailpit locally; Amazon SES on Day 6
management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: debug       # print every SQL statement, to spot N+1 queries