app:
  jwt:
    # Dev-only default after the colon; on AWS (Day 6) the real secret comes from the JWT_SECRET variable
    secret: ${JWT_SECRET:hSJBO50ZVgvvE4rZcXOddVW4R5pzNkVEnZHpfrpbrGE=}
    ttl: 1h                        # token lifetime; Spring converts "1h" into a Duration
    issuer: finance-ledger
  reminders:
    cron: "0 * * * * *"              # second minute hour day month weekday: 9:00 AM daily    //0 * * * * *   //0 0 9 * * *
    zone: Asia/Kolkata               # the users' time zone, not the server's
  mail:
    from: "Finance Ledger <no-reply@finance-ledger.local>"
spring:
  application:
    name: finance-ledger
  datasource:                      # used when you run without Docker Compose support
    url: jdbc:postgresql://localhost:5432/expenses
    username: expenses
    password: expenses
  jpa:
    open-in-view: false            # no lazy loading in controllers (explained below)
    hibernate:
      ddl-auto: validate           # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: true                  # print every SQL statement, to spot N+1 queries
  threads:
    virtual:
      enabled: true                # Java 21 virtual threads for requests

  mail:
    host: localhost
    port: 1025                       # Mailpit locally; Amazon SES on Day 6
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  cache:
    type: caffeine                  # Day 6: use the Caffeine in-memory cache implementation
    cache-names: monthlySummary
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=10m  # TTL = safety net for missed evictions
management:
  endpoints:
    web:
      exposure:
        include: health,info
    health:
      show-details: always
    mail:
      enabled: false   # an SES hiccup must not mark the whole app DOWN

logging:
  level:
    org.hibernate.SQL: debug       # print every SQL statement, to spot N+1 queries
    org.springframework.cache: TRACE   # print cache-related debug information
springdoc:
  swagger-ui:
    operations-sorter: alpha   # GET, POST, PUT, PATCH, DELETE; or "alpha" to sort by path