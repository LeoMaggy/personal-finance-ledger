services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: expenses
      POSTGRES_USER: expenses
      POSTGRES_PASSWORD: expenses
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives restarts

  mailpit:
    image: axllent/mailpit          # local test inbox; pin a version tag for anything shared
    ports:
      - "1025:1025"                 # SMTP: the app sends mail here
      - "8025:8025"                 # web inbox: http://localhost:8025
volumes:
  pgdata: